version: '3.8'

services:
  # Main service for development and interactive use
  richter-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: richter-predictor-fia
    image: richter-predictor:latest
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./models:/app/models:rw
      - ./reports:/app/reports:rw
      - ./submissions:/app/submissions:rw
      - ./logs:/app/logs:rw
      - richter_cache:/app/.cache
    environment:
      - PYTHONPATH=/app/src:/app/tests
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-""}
      - RICHTER_BATCH_SIZE=${RICHTER_BATCH_SIZE:-2048}
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - richter-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # Training service - Nested CV
  richter-training-nested:
    extends: richter-predictor
    container_name: richter-training-nested
    command: python src/models/train_nested_cv_ensemble.py
    environment:
      - PYTHONPATH=/app/src
      - TF_CPP_MIN_LOG_LEVEL=1
      - RICHTER_MODE=training
      - RICHTER_TARGET_F1=0.78
    profiles:
      - training
    deploy:
      resources:
        limits:
          memory: 12G

  # Training service - Simple
  richter-training-simple:
    extends: richter-predictor
    container_name: richter-training-simple
    command: python src/models/train_simple_holdout.py
    environment:
      - PYTHONPATH=/app/src
      - TF_CPP_MIN_LOG_LEVEL=1
      - RICHTER_MODE=development
    profiles:
      - training-simple
    deploy:
      resources:
        limits:
          memory: 6G

  # Testing service
  richter-tests:
    extends: richter-predictor
    container_name: richter-tests-fia
    command: python tests/run_tests.py
    environment:
      - PYTHONPATH=/app/src:/app/tests
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=""
      - RICHTER_MODE=testing
    profiles:
      - testing
    deploy:
      resources:
        limits:
          memory: 6G

  # EDA service
  richter-eda:
    extends: richter-predictor
    container_name: richter-eda
    command: python src/data/eda.py
    environment:
      - PYTHONPATH=/app/src
      - RICHTER_MODE=analysis
      - MATPLOTLIB_BACKEND=Agg
    profiles:
      - eda
    deploy:
      resources:
        limits:
          memory: 4G

  # Note: Submission services are now handled through richter-app
  # using the new separate scripts: create_submission_simple.py and create_submission_ensemble.py

networks:
  richter-network:
    driver: bridge

volumes:
  richter_cache:
    driver: local